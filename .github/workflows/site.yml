name: Site validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated pages
        run: python scripts/build_site.py --check
      - name: Build public directory
        run: python scripts/build_site.py
      - name: Audit links and publication boundaries
        run: python scripts/audit_public_narrative.py
      - name: Verify media contract
        run: python scripts/test_media.py
      - name: Check JavaScript
        run: node --check assets/site.js
      - name: Install browser test dependencies
        run: |
          pip install -r scripts/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Test browser interactions
        run: python scripts/test_browser.py
      - name: Upload public site
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: dist
